<!-- templates/admin.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DACKY - Admin</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='assets/Minilogo dacky.png') }}" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    body { font-family: 'Montserrat', sans-serif; background-color:#FFFBF4; margin:0; overflow:hidden; }
    .wrapper { display:flex; height:100vh; }
    .sidebar { width:240px; background:#11120D; color:#FFFBF4; transition: all 0.3s; overflow-y:auto; }
    .sidebar h3 { color:#D8CFBC; text-align:center; margin:20px 0; }
    .sidebar a { display:block; padding:12px 20px; color:#FFFBF4; text-decoration:none; transition:background .2s; }
    .sidebar a:hover, .sidebar a.active { background:#565449; border-radius:6px; }

    .sidebar.collapsed { width:60px; }
    .sidebar.collapsed h3, .sidebar.collapsed a span { display:none; }
    .sidebar.collapsed a i { margin-right:0; text-align:center; width:100%; }

    .content { flex:1; padding:20px; overflow:hidden; display:flex; flex-direction:column; transition: margin-left 0.3s; }
    .content-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .btn-dacky { background:#565449; color:#FFFBF4; border:none;}
    .btn-dacky:hover { background:#33322c; }

    /* Tabla scroll interno */
    .table-container { flex:1; overflow:auto; }
    .table thead { background:#D8CFBC; color:#11120D; position:sticky; top:0; z-index:2; }
    .table tbody tr:hover { background:#f4f2ec; }

    /* Botón hamburguesa */
    .toggle-btn { background:none; border:none; font-size:1.5rem; color:#11120D; margin-right:15px; }
  </style>
</head>
<body>

<div class="wrapper">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <h3>DACKY Admin</h3>
    <a href="{{ url_for('admin_dashboard', view='iniciosesion') }}" class="{% if active=='iniciosesion' %}active{% endif %}">
      <i class="fa-solid fa-users"></i> <span>Inicio Sesión</span>
    </a>
    <a href="{{ url_for('admin_dashboard', view='perfildueno') }}" class="{% if active=='perfildueno' %}active{% endif %}">
      <i class="fa-solid fa-user"></i> <span>Dueños</span>
    </a>
    <a href="{{ url_for('admin_dashboard', view='perfilmascota') }}" class="{% if active=='perfilmascota' %}active{% endif %}">
      <i class="fa-solid fa-id-card"></i> <span>Perfil Mascota</span>
    </a>
    <a href="{{ url_for('admin_dashboard', view='mascota') }}" class="{% if active=='mascota' %}active{% endif %}">
      <i class="fa-solid fa-dog"></i> <span>Mascotas</span>
    </a>
    <a href="{{ url_for('admin_dashboard', view='vacunasmascota') }}" class="{% if active=='vacunasmascota' %}active{% endif %}">
      <i class="fa-solid fa-syringe"></i> <span>Vacunas</span>
    </a>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="content-header">
      <div>
        <button class="toggle-btn" id="toggleSidebar"><i class="fa-solid fa-bars"></i></button>
        <h2 style="display:inline-block">{{ titulo }}</h2>
      </div>
      <div>
        <button class="btn btn-dacky" id="btnNuevo"><i class="fa fa-plus"></i> Nuevo</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('logout') }}">Cerrar sesión</a>
      </div>
    </div>

    <!-- Tabla con scroll interno -->
    <div class="table-container">
      <table class="table table-bordered align-middle">
        <thead>
          <tr>
            {% for col in columnas %}
              <th>{{ col }}</th>
            {% endfor %}
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          {% for fila in datos %}
          <tr>
            {% for col in columnas %}
              <td>{{ fila[col] }}</td>
            {% endfor %}
            <td class="action-icons">
              <a class="edit" href="#" data-id="{{ (fila[columnas[0]]) }}"><i class="fa fa-pencil"></i></a>
              <a class="delete" href="#" data-id="{{ (fila[columnas[0]]) }}"><i class="fa fa-trash"></i></a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal CRUD -->
<div class="modal fade" id="crudModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form id="crudForm">
        <div class="modal-header">
          <h5 class="modal-title" id="crudTitle">Nuevo</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="crudBody">
          <!-- Campos dinámicos -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-dacky">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Modal Confirm Delete -->
<div class="modal fade" id="confirmDeleteModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Confirmar eliminación</h5></div>
      <div class="modal-body"><p id="deleteText"></p></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Eliminar</button>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // Variables desde server
  const activeView = "{{ active }}";
  const columnas = {{ columnas|tojson }};

  function renderFormFields(view, data = {}) {
    if (view === 'iniciosesion') {
      return `
        <input type="hidden" name="IdInicioSesion" value="${data.IdInicioSesion||''}">
        <div class="mb-3"><label>Nombre</label><input name="Nom" class="form-control" value="${data.Nom||''}" required></div>
        <div class="mb-3"><label>Apellido</label><input name="Apell" class="form-control" value="${data.Apell||''}" required></div>
        <div class="mb-3"><label>Email</label><input name="Email" type="email" class="form-control" value="${data.Email||''}" required></div>
        <div class="mb-3"><label>Contraseña (dejar vacío para no cambiar)</label><input name="Contrasena" type="password" class="form-control"></div>
        <div class="mb-3"><label>Teléfono</label><input name="NumTelf" class="form-control" value="${data.NumTelf||''}"></div>
        <div class="mb-3"><label>Dirección</label><input name="Direccion" class="form-control" value="${data.Direccion||''}"></div>
        <div class="mb-3"><label>Rol</label>
          <select name="rol" class="form-control">
            <option value="usuario" ${data.rol==='usuario'?'selected':''}>usuario</option>
            <option value="admin" ${data.rol==='admin'?'selected':''}>admin</option>
          </select>
        </div>
      `;
    }
    if (view === 'perfildueno') {
      return `
        <input type="hidden" name="IdPerfilDueño" value="${data.IdPerfilDueño||''}">
        <div class="mb-3"><label>Nombre Dueño</label><input name="NomDueño" class="form-control" value="${data.NomDueño||''}" required></div>
        <div class="mb-3"><label>Apellido</label><input name="Apell" class="form-control" value="${data.Apell||''}" required></div>
        <div class="mb-3"><label>Email</label><input name="Email" type="email" class="form-control" value="${data.Email||''}"></div>
        <div class="mb-3"><label>Teléfono</label><input name="NumTelf" class="form-control" value="${data.NumTelf||''}"></div>
        <div class="mb-3"><label>Celular</label><input name="NumCel" class="form-control" value="${data.NumCel||''}"></div>
        <div class="mb-3"><label>Dirección</label><input name="Direccion" class="form-control" value="${data.Direccion||''}"></div>
        <div class="mb-3"><label>IdInicioSesion (opcional)</label><input name="IdInicioSesion" class="form-control" value="${data.IdInicioSesion||''}"></div>
      `;
    }
    if (view === 'perfilmascota') {
      return `
        <input type="hidden" name="IdPerfilMascota" value="${data.IdPerfilMascota||''}">
        <div class="mb-3"><label>Nombre Mascota</label><input name="NomMascota" class="form-control" value="${data.NomMascota||''}" required></div>
        <div class="mb-3"><label>Raza</label><input name="Raza" class="form-control" value="${data.Raza||''}" required></div>
        <div class="mb-3"><label>Peso</label><input name="Peso" class="form-control" value="${data.Peso||''}" required></div>
        <div class="mb-3"><label>Altura</label><input name="Altura" class="form-control" value="${data.Altura||''}" required></div>
        <div class="mb-3"><label>Edad</label><input name="Edad" class="form-control" value="${data.Edad||''}" required></div>
        <div class="mb-3"><label>Descripción</label><textarea name="Descripcion" class="form-control">${data.Descripcion||''}</textarea></div>
        <div class="mb-3"><label>PerfilDueño_IdPerfilDueño</label><input name="PerfilDueño_IdPerfilDueño" class="form-control" value="${data.PerfilDueño_IdPerfilDueño||''}"></div>
      `;
    }
    if (view === 'mascota') {
      return `
        <input type="hidden" name="IdMascota" value="${data.IdMascota||''}">
        <div class="mb-3"><label>NumMascota</label><input name="NumMascota" class="form-control" value="${data.NumMascota||''}" required></div>
        <div class="mb-3"><label>PerfilDueño_IdPerfilDueño</label><input name="PerfilDueño_IdPerfilDueño" class="form-control" value="${data.PerfilDueño_IdPerfilDueño||''}" required></div>
        <div class="mb-3"><label>PerfilMascota_IdPerfilMascota</label><input name="PerfilMascota_IdPerfilMascota" class="form-control" value="${data.PerfilMascota_IdPerfilMascota||''}" required></div>
      `;
    }
    if (view === 'vacunasmascota') {
      return `
        <input type="hidden" name="IdVacunasMascota" value="${data.IdVacunasMascota||''}">
        <div class="mb-3"><label>NomVacuna</label><input name="NomVacuna" class="form-control" value="${data.NomVacuna||''}" required></div>
        <div class="mb-3"><label>Mascota_IdMascota</label><input name="Mascota_IdMascota" class="form-control" value="${data.Mascota_IdMascota||''}" required></div>
        <div class="mb-3"><label>FechaVac</label><input name="FechaVac" type="date" class="form-control" value="${data.FechaVac||''}"></div>
        <div class="mb-3"><label>Edad</label><input name="Edad" class="form-control" value="${data.Edad||''}"></div>
        <div class="mb-3"><label>FechaVenVac</label><input name="FechaVenVac" type="date" class="form-control" value="${data.FechaVenVac||''}"></div>
        <div class="mb-3"><label>NumDosis</label><input name="NumDosis" class="form-control" value="${data.NumDosis||''}"></div>
        <div class="mb-3"><label>Nota</label><textarea name="Nota" class="form-control">${data.Nota||''}</textarea></div>
      `;
    }
    return '<p>Formulario no implementado para esta vista</p>';
  }

  // DOM modal
  const crudModalEl = document.getElementById('crudModal');
  const crudModal = new bootstrap.Modal(crudModalEl);
  const crudForm = document.getElementById('crudForm');
  const crudBody = document.getElementById('crudBody');
  const crudTitle = document.getElementById('crudTitle');
  let editingId = null;
  let currentView = activeView;

  // Nuevo
  document.getElementById('btnNuevo').addEventListener('click', () => {
    editingId = null;
    crudTitle.innerText = 'Nuevo - ' + (document.querySelector('.sidebar a.active')?.textContent.trim() || currentView);
    crudBody.innerHTML = renderFormFields(currentView, {});
    crudModal.show();
  });

  // Edit buttons
  document.querySelectorAll('.edit').forEach(el => {
    el.addEventListener('click', async (e) => {
      e.preventDefault();
      const id = el.getAttribute('data-id');
      const res = await fetch(`/admin/get/${currentView}/${id}`);
      const json = await res.json();
      editingId = id;
      crudTitle.innerText = 'Editar - ' + (document.querySelector('.sidebar a.active')?.textContent.trim() || currentView);
      crudBody.innerHTML = renderFormFields(currentView, json);
      crudModal.show();
    });
  });

  // Delete buttons
  let deleteTargetId = null;
  const confirmDeleteModal = new bootstrap.Modal(document.getElementById('confirmDeleteModal'));
  document.querySelectorAll('.delete').forEach(el => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      deleteTargetId = el.getAttribute('data-id');
      document.getElementById('deleteText').innerText = `¿Eliminar registro ID ${deleteTargetId}? Esta acción no se puede deshacer.`;
      confirmDeleteModal.show();
    });
  });

  document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
    if (!deleteTargetId) return;
    const res = await fetch(`/admin/delete/${currentView}/${deleteTargetId}`, { method: 'DELETE' });
    const j = await res.json();
    if (res.ok && j.success) {
      location.reload();
    } else {
      alert(j.message || 'Error al eliminar');
    }
  });

  // Submit (create/update)
  crudForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(crudForm);
    const obj = {};
    formData.forEach((v,k) => obj[k] = v);
    if (editingId) {
      const res = await fetch(`/admin/update/${currentView}/${editingId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(obj)
      });
      const j = await res.json();
      if (res.ok && j.success) {
        crudModal.hide();
        location.reload();
      } else {
        alert(j.message || 'Error al actualizar');
      }
    } else {
      const res = await fetch(`/admin/add/${currentView}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(obj)
      });
      const j = await res.json();
      if (res.ok && j.success) {
        crudModal.hide();
        location.reload();
      } else {
        alert(j.message || 'Error al crear');
      }
    }
  });
</script>
</body>
</html>
