plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // 🆕 Plugin de Google Services
    id "com.google.gms.google-services"
}

android {
    namespace = "com.example.dacky_app"
    compileSdk = 35  // 🆕 Actualizado para Firebase y plugins
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.example.dacky_app"
        minSdk = 23  // 🆕 Firebase Auth requiere mínimo API 23
        targetSdk = 35
        versionCode = 1
        versionName = "1.0.0"
        // 🆕 Soporte para multidex (si tu app crece mucho)
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // 🆕 Dependencias de Firebase (se agregan automáticamente, pero por si acaso)
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
}