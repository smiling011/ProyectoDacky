name: CI - Backend

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 12345
          MYSQL_DATABASE: dacky
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Mostrar estructura de archivos
        run: ls -R .

      - name: Configurar Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Instalar dependencias del backend
        run: |
          python -m pip install --upgrade pip
          pip install -r "DackyApp/backend/requirements.txt"
          pip install pytest

      - name: Reemplazar host MySQL en config.py
        run: sed -i "s/localhost/mysql/" "DackyApp/backend/app/utils/config.py"

      - name: Esperar que MySQL esté listo
        run: sleep 30

      - name: Ejecutar pruebas con pytest
        run: pytest "DackyApp/backend/tests" -v
