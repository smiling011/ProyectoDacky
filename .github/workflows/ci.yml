name: CI - Backend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 12345
          MYSQL_DATABASE: dacky
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r DackyApp/backend/requirements.txt
          pip install pytest

      - name: Esperar a MySQL
        run: sleep 30

      - name: Sobrescribir config de DB
        run: |
          sed -i 's/localhost/mysql/' DackyApp/backend/app/utils/config.py

      - name: Ejecutar tests
        run: pytest DackyApp/backend/tests -v
